# --- Database ---
# Uses DATABASE_URL env var on Railway; falls back to local H2 for development
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./jobs}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 dialect when running locally; overridden by DB_PLATFORM on Railway with Postgres
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}

# --- H2 Console (local dev only) ---
spring.h2.console.enabled=${H2_CONSOLE:true}

# --- Server ---
server.port=${PORT:8080}
